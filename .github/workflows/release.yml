name: Publish Release

# 推送 v* 标签时自动创建 GitHub Release，并附上编译好的 exe 与压缩包。
# 使用仓库自带的 GITHUB_TOKEN，无需配置任何额外密钥。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare assets
        run: |
          set -e
          mkdir -p out
          cp dist/NarakaClientSwitcher.exe "out/NarakaClientSwitcher-${GITHUB_REF_NAME}.exe"
          cp "docs/使用说明.txt" "out/使用说明.txt"
          (cd out && zip -r "../naraka-client-switcher-${GITHUB_REF_NAME}.zip" .)
          echo "--- prepared ---"
          ls -l out
          ls -l "naraka-client-switcher-${GITHUB_REF_NAME}.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NOTES="docs/release-notes-${GITHUB_REF_NAME}.md"
          TITLE="永劫无间 · 免下载切客户端 ${GITHUB_REF_NAME}"
          if [ -f "$NOTES" ]; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              "out/NarakaClientSwitcher-${GITHUB_REF_NAME}.exe" \
              "naraka-client-switcher-${GITHUB_REF_NAME}.zip"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "$TITLE" \
              --generate-notes \
              "out/NarakaClientSwitcher-${GITHUB_REF_NAME}.exe" \
              "naraka-client-switcher-${GITHUB_REF_NAME}.zip"
          fi
